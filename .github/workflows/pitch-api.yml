
name: TahminArena PitchAPI

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: write

concurrency:
  group: pitch-api-update
  cancel-in-progress: false

jobs:
  ligleri-guncelle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Butun ligleri indir
        env:
          API_KEY: ${{ secrets.PITCH_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data/pitch

          curl -fsS --retry 3 \
            -H "X-API-KEY: $API_KEY" \
            "https://api.pitchapi.dev/v1/leagues" \
            -o /tmp/leagues.json

          jq -e '.data.leagues | type == "array"' \
            /tmp/leagues.json

          jq '[
            .data.leagues[]
            | select(.country_code != "KSA")
            | select(.name != "MLS")
          ]' /tmp/leagues.json > /tmp/catalog.json

          jq -c '.[]' /tmp/catalog.json |
          while IFS= read -r league; do

            id=$(echo "$league" | jq -r '.id')
            name=$(echo "$league" | jq -r '.name')

            echo "Indiriliyor: $name ($id)"

            target="data/pitch/${id}.json"

            if curl -fsS --retry 2 \
              --max-time 120 \
              -H "X-API-KEY: $API_KEY" \
              "https://api.pitchapi.dev/v1/leagues/${id}/matches?status=all" \
              -o "${target}.tmp"; then

              if jq -e --arg id "$id" \
                '(.data.league.id == $id) and
                 (.data.matches | type == "array")' \
                "${target}.tmp" > /dev/null; then

                mv "${target}.tmp" "$target"
                echo "Basarili: $name"

              else
                rm -f "${target}.tmp"
                echo "UYARI: Gecersiz veri: $name"
              fi
            else
              rm -f "${target}.tmp"
              echo "UYARI: Indirilemedi: $name"
            fi

            sleep 2
          done

          cp /tmp/catalog.json data/pitch/leagues.json

      - name: GitHub kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/pitch/

          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "PitchAPI liglerini guncelle"
            git pull --rebase origin main
            git push origin main
          fi
