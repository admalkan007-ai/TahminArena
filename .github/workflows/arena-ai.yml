name: Arena AI V6
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: arena-ai-v6
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node arena-run.mjs
        env:
          AI_WORKER_URL: ${{ vars.AI_WORKER_URL }}
          AI_ADMIN_TOKEN: ${{ secrets.AI_ADMIN_TOKEN }}
          ODDS_TEST_TOKEN: ${{ secrets.ODDS_TEST_TOKEN }}
