name: TahminArena Futbol Verileri

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: football-data-update
  cancel-in-progress: false

jobs:
  update-football-data:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Liglerin gercek verilerini indir
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          # Her istek arasinda 7 saniye bekleyerek ucretsiz API limitini koru.
          get_data() {
            local code="$1" slug="$2" endpoint="$3" suffix="$4"
            local filename="data/${slug}${suffix}.json"
            echo "Indiriliyor: $filename"
            curl --fail --silent --show-error --retry 2 --retry-delay 10 \
              -H "X-Auth-Token: $API_KEY" \
              "https://api.football-data.org/v4/competitions/${code}/${endpoint}" \
              -o "${filename}.tmp"
            mv "${filename}.tmp" "$filename"
            sleep 7
          }

          # Premier League dosya adlari degismiyor.
          # Diger ligler de ayni adlandirma sistemini kullaniyor.
          while read -r code slug; do
            get_data "$code" "$slug" 'matches?status=SCHEDULED' ''
            get_data "$code" "$slug" 'standings' '-standings'
            get_data "$code" "$slug" 'matches?status=FINISHED' '-results'
          done <<'LEAGUES'
          PL premier-league
          PD1 la-liga
          BL1 bundesliga
          SA1 serie-a
          FL1 ligue-1
          DED eredivisie
          PPL primeira-liga
          CL champions-league
          WC world-cup
          LEAGUES

      - name: Verileri GitHub'a kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Futbol verilerini guncelle"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Degisen veri yok."
          fi
