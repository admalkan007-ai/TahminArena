
name: TahminArena Futbol Verileri

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: football-data-update
  cancel-in-progress: false

jobs:
  update-football-data:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Liglerin gercek verilerini indir
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          get_data() {
            local code="$1"
            local slug="$2"
            local endpoint="$3"
            local suffix="$4"
            local filename="data/${slug}${suffix}.json"

            echo "Indiriliyor: $filename"

            curl --fail --silent --show-error \
              --retry 2 --retry-delay 65 \
              -H "X-Auth-Token: $API_KEY" \
              "https://api.football-data.org/v4/competitions/${code}/${endpoint}" \
              -o "${filename}.tmp"

            if jq -e --arg code "$code" \
              '.competition.code == $code' \
              "${filename}.tmp" > /dev/null; then
              mv "${filename}.tmp" "$filename"
              echo "Dogru lig verisi kaydedildi: $code"
            else
              rm -f "${filename}.tmp"
              echo "Hatali lig verisi: $code"
              return 1
            fi

            sleep 7
          }

          update_league() {
            get_data "$1" "$2" "matches" ""
            get_data "$1" "$2" "standings" "-standings"
            get_data "$1" "$2" "matches?status=FINISHED" "-results"
          }

          update_league PL premier-league
          update_league PD la-liga
          update_league BL1 bundesliga
          update_league SA serie-a
          update_league FL1 ligue-1
          update_league DED eredivisie
          update_league PPL primeira-liga
          update_league CL champions-league
                   get_data WC world-cup "matches" ""
          get_data WC world-cup "matches?status=FINISHED" "-results"

      - name: Verileri GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Futbol verilerini guncelle"
            git pull --rebase origin main
            git push origin main
          fi
