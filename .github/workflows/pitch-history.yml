
name: PitchAPI Gecmis Sezon Arsivi

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitch-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repoyu ac
        uses: actions/checkout@v4

      - name: Tum liglerin gecmis sezonlarini indir
        env:
          PITCH_API_KEY: ${{ secrets.PITCH_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.pitchapi.dev"

          mkdir -p data/pitch-history

          curl --fail --silent --show-error \
            --max-time 90 \
            -H "X-API-KEY: $PITCH_API_KEY" \
            "$API/v1/leagues" \
            -o /tmp/leagues.json

          jq -r '
            (.data |
              if type == "array" then .
              else .leagues end
            )[]
            | select(.country_code != "KSA")
            | select(.name != "MLS")
            | [.id, .name]
            | @tsv
          ' /tmp/leagues.json > /tmp/league-list.txt

          SEASONS=(
            "2021/2022"
            "2022/2023"
            "2023/2024"
            "2024/2025"
            "2025/2026"
            "2021"
            "2022"
            "2023"
            "2024"
            "2025"
          )

          BASARILI=0
          TOPLAM=0
          ATLANAN=0
          BASARISIZ=0

          while IFS=$'\t' read -r ID NAME; do

            if [[ ! "$ID" =~ ^l_[a-zA-Z0-9]+$ ]]; then
              continue
            fi

            mkdir -p "data/pitch-history/$ID"

            echo "================================"
            echo "LIG: $NAME"
            echo "================================"

            for SEASON in "${SEASONS[@]}"; do

              FILE="${SEASON//\//-}"

              TARGET="data/pitch-history/$ID/$FILE.json"

              if [ -s "$TARGET" ]; then
                echo "$NAME $SEASON: Zaten kayitli"
                ATLANAN=$((ATLANAN + 1))
                continue
              fi

              if curl --fail --silent --show-error \
                --retry 2 \
                --retry-delay 10 \
                --max-time 60 \
                -H "X-API-KEY: $PITCH_API_KEY" \
                --get "$API/v1/leagues/$ID/matches" \
                --data-urlencode "season=$SEASON" \
                --data-urlencode "status=played" \
                -o /tmp/history.json; then

                if jq -e \
                  --arg id "$ID" \
                  --arg season "$SEASON" \
                  '.data.league.id == $id and
                   (.data.league.season | tostring) == $season and
                   (.data.matches | type == "array")' \
                  /tmp/history.json > /dev/null; then

                  jq '.data.matches |= map(
                    select(
                      .status == "finished" and
                      .score_home != null and
                      .score_away != null
                    )
                  )' /tmp/history.json \
                    > /tmp/finished.json

                  COUNT=$(jq \
                    '.data.matches | length' \
                    /tmp/finished.json)

                  if [ "$COUNT" -gt 0 ]; then

                    cp /tmp/finished.json "$TARGET"

                    BASARILI=$((BASARILI + 1))
                    TOPLAM=$((TOPLAM + COUNT))

                    echo "BASARILI: $NAME $SEASON - $COUNT mac"

                  else
                    echo "$NAME $SEASON: Mac bulunamadi"
                  fi

                else
                  echo "$NAME $SEASON: Sezon dogrulanamadi"
                fi

              else
                echo "$NAME $SEASON: API istegi basarisiz"
                BASARISIZ=$((BASARISIZ + 1))
              fi

              sleep 5

            done

          done < /tmp/league-list.txt

          echo "================================"
          echo "ARSIV RAPORU"
          echo "Yeni sezon dosyasi: $BASARILI"
          echo "Yeni mac kaydi: $TOPLAM"
          echo "Onceden kayitli sezon: $ATLANAN"
          echo "Basarisiz API istegi: $BASARISIZ"
          echo "================================"

          if [ "$BASARILI" -eq 0 ] && [ "$ATLANAN" -eq 0 ]; then
            echo "Arsiv verisi bulunamadi"
            exit 1
          fi

      - name: Arsivi GitHub'a kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d data/pitch-history ]; then
            exit 0
          fi

          git add data/pitch-history/

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Tum liglerin gecmis sezon arsivi"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
