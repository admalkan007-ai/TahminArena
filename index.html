
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TahminArena</title>
  <style>
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #191919;
      color: #f4c542;
      padding: 22px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }
    main { padding: 18px; }
    .card {
      background: #202020;
      border: 1px solid #6b551c;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 14px;
    }
    h2 { color: #f4c542; }
    p { color: #cccccc; }
  </style>
</head>
<body>
  <header>⚽ TahminArena</header>
  <main>
    <div class="card">
      <h2>🔴 Canlı Skorlar</h2>
      <p>Yakında tüm dünyadan canlı maçlar burada.</p>
    </div>
    <div class="card">
      <h2>📊 Ücretsiz İstatistikler</h2>
      <p>Günlük seçilen 2 maçın istatistikleri.</p>
    </div>
    <div class="card">
      <h2>👑 Premium</h2>
      <p>Detaylı istatistikler ve özel tahminler.</p>
    </div>
  </main>
</body>
</html>
